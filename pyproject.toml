[project]
name = "ballsdex-packs"
version = "2.4.0"

description = "Pack collection and opening system for BallsDex 3.0+"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Seif", email = "seiftheman1@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/seiftheman/ballsdex-packs"
Documentation = "https://github.com/seiftheman/ballsdex-packs#readme"
Issues = "https://github.com/seiftheman/ballsdex-packs/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["packs*"]
exclude = ["assets*", "tests*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
